manifest_version: 2
id: apple
ecs_version: "9.4.0-dev"
target: "Apple/iCloud"
last_updated: "2025-11-24"




files:
  - id: "apple_signon_info"
    path: "Apple*Account and device information/Apple ID SignOn Information.csv"
    parser:
      format: "csv"

  - id: "apple_account_info_PWD" # not ideal that this is duplicated but necessary
    path: "Apple*Account and device information/Apple ID Account Information.csv"
    parser:
      format: "csv"
      drop_duplicates: { subset: ["Last Password Change Date"], keep: "last"}

  - id: "apple_recovery_contacts"
    path: "Apple*Account and device information/Apple ID Account Recovery Contacts Information.csv"
    parser: 
      format: "csv"
      drop_duplicates: { subset: ["Recovery ID"], keep: "row_completeness"}

  - id: "apple_legacy_contacts"
    path: "Apple*Account and device information/Apple ID Account Legacy Contacts Information.csv"
    parser: 
      format: "csv"
      drop_duplicates: { subset: ["Beneficiary ID"], keep: "row_completeness"}
  
  
  - id: "apple_data_privacy_requests"
    path: "Apple*Account and device information/Data & Privacy Request History.csv"
    parser:
      format: "csv"
      drop_duplicates: { subset: ["Request ID"], keep: last}
  
  - id: "apple_device_info"
    path: "Apple*Account and device information/Apple ID Device Information.csv"
    parser:
      format: "csv"
      drop_duplicates: { subset: ["Device Serial Number"], keep: "last"}

  - id: "apple_messaging_devices"
    path: "Apple*Account and device information/Apple ID Messaging Devices Information.csv"
    parser:
      format: "csv"
      drop_duplicates: { subset: ["Messaging Device ID"], keep: "last"}


  # - id: "apple_saved_safari_history" 
  #   path: "anon-apple/Other Data Part 4 of 5/Apple Features Using iCloud/SafariBrowsingHistory/SafariBrowsingHistory.csv"
  #   parser:
  #     format: "csv"
  #     drop_duplicates: { subset: ["URL", "Time"], keep: "first"}

  - id: "apple_passkey"
    path: "Apple*Account and device information/Passkeys Information.csv"
    parser:
      format: "csv"
      drop_duplicates: { subset: ["Created Date"], keep: "first"}


  # - id: "apple_app_download_history" 
  #   path: "Apple Media Services Information/Update and Redownload History/iTunes and App-Book Re-download and Update History.csv"
  #   parser:
  #     format: "csv"

  # deprecated: parser undercounts rows against the real export, needs investigation before re-enabling
  # - id: "apple_push_notifications"
  #   path: "App install and push notification activity/Push Notifications.csv"
  #   parser:
  #     format: "csv"

  - id: "apple_messaging_json"
    path: "Devices Registered with Apple Messaging.json"
    parser:
      format: "json"
      json_root: "devices[]"

  # TODO NEED TO GET INTO OTHER_DATA_4

  - id: "apple_find_my_devices"
    path: "*Other Data*/Devices*.csv"
    parser:
      format: "csv_multi"


views:
  
# -------------------------- AUTHENTICATION EVENTS --------------------------
- file: 
    id: "apple_signon_info"
  static:
      event.action: "user_login"
      event.kind: "event"
      event.category: ["authentication", "session"]
      event.type: ["start"]
      event.outcome: "success"
  fields:
  - {target: "@timestamp", source: "Logged In Date", type: "datetime"}
  - {target: "client.ip", source: "IP Address", type: "string"}
  - {target: "device.id.apple", source: "Device Identifier", type: "string"} # apple's specific device fingerprint
  - {target: "service.name", source: "Application", type: "string"}


- file: 
    id: "apple_account_info_PWD"
  static:
      event.action: "user_password_change"
      event.kind: "event"
      event.category: ["iam"]
      event.type: ["change"]
  fields:
  - {target: "@timestamp", source: "Last Password Change Date", type: "datetime"}
  - {target: "client.ip", source: "Advanced Data Protection - Device IP Address", type: "string"}
  - {target: "entity.display_name", source: "Advanced Data Protection - Device Name", type: "string"}
  - {target: "device.serial_number", source: "Advanced Data Protection - Device Serial Number", type: "string"}


- file: 
    id: "apple_recovery_contacts"
  static:
      event.action: "recovery_contact_addition"
      event.kind: "event"
      event.category: ["iam"]
      event.type: ["creation", "user"]
  fields:
  - {target: "@timestamp", source: "Recovery Create Date", type: "datetime"}
  - {target: "client.ip", source: "Recovery IP Address", type: "string"}
  - {target: "device.model.name", source: "Device Model", type: "string"}

- file:
    id: "apple_legacy_contacts"
  static:
      event.action: "legacy_contact_addition"
      event.kind: "event"
      event.category: ["iam"]
      event.type: ["creation", "user"]
  fields:
  - {target: "@timestamp", source: "Beneficiary Create Date", type: "datetime"}
  - {target: "client.ip", source: "Beneficiary IP Address", type: "string"}
  - {target: "device.model.name", source: "Device Model Name", type: "string"}

- file:
    id: "apple_passkey"
  static:
    event.kind: "state"
    event.category: ["authentication", "session"]
    event.type: ["info"]
    entity.type: "host"
    entity.sub_type: "passkey_registration"
  fields:
    - {target: "device.serial_number", source: "Device Serial Number", type: "string"}
    - {target: "device.model.name", source: "Hardware Model", type: "string"}
    - {target: "entity.id", source: "Credential ID", type: "string"}
    - {target: "public_key", source: "Public Key", type: "string"}


# -------------------------- MISC ACTIVITY EVENTS --------------------------
- file: 
    id: "apple_data_privacy_requests"
  static:
      event.action: "data_export_request"
      event.kind: "event"
      event.category: ["iam"]
      event.type: ["creation"]
  fields:
  - {target: "@timestamp", source: "Request Time", type: "datetime"}
  - {target: "event.end", source: "Request Completed Time", type: "datetime"}


# - file: 
#     id: "apple_saved_safari_history"
#   static:
#     event.kind: "event"
#     event.action: "safari_search"
#     event.category: ["web"]
#     event.type: ["access"]
#   fields:
#   - {target: "@timestamp", source: "Time", type: "datetime"}
#   - {target: "url.full", source: "URL", type: "string"}
#   - {target: "url.title", source: "Title", type: "string"}






# -------------------------- ASSETS --------------------------

- file: 
    id:   "apple_device_info"
  static:
      event.kind: "state"
      event.category: ["authentication", "session"]
      event.type: ["info"]
      entity.type: "host"
      entity.sub_type: "hardware_registration"
  fields:
  - {target: "entity.last_seen_timestamp", source: "Device Last Heartbeat Timestamp", type: "datetime"}
  - {target: "entity.first_seen_timestamp", source: "Device Added Date", type: "datetime"}
  - {target: "entity.display_name", source: "Device Name", type: "string"}
  - {target: "device.serial_number", source: "Device Serial Number", type: "string"}
  - {target: "device.model.name", source: "Device Model Name", type: "string"}
  - {target: "device.imei", source: "Device IMEI", type: "string"}
  - {target: "device.meid", source: "Device MEID", type: "string"}
  - {target: "client.ip", source: ["Device Last Heartbeat IP Address", "Device Last Heartbeat IP"], transform: coalesce, type: "string"}

- file: 
    id: "apple_messaging_devices"
  static:
      event.kind: "state"
      event.category: ["authentication", "session"]
      event.type: ["info"]
      entity.type: "application"
      entity.sub_type: "app_registration"
  fields:
  - {target: "device.model.identifier", source: "hardware-version", type: "string"}
  - {target: "entity.display_name", source: "device-name", type: "string"}
  - {target: "user_agent.original", source: "os-version", type: "string"}
  # TODO: potential 2FA field

# deprecated along with the apple_push_notifications file entry above
# - file:
#     id: "apple_push_notifications"
#   static:
#     event.kind: "event"
#     event.action: "push_notification"
#     event.category: ["web"]
#     event.type: ["access"]
#   fields:
#   - {target: "@timestamp", source: "Event Time", type: "datetime"}
#   - {target: "client.ip", source: "IP Network", type: "string"}
#   - {target: "user_agent.original", source: "User Agent", type: "string"}
#   - {target: "os.version", source: "Operating System Version", type: "string"}
#   - {target: "service.name", source: "App Name", type: "string"}
#   - {target: "geo.city_name", source: "IP City", type: "string"}
#   - {target: "geo.country_iso_code", source: "IP Country Code", type: "string"}
#   - {target: "geo.region_iso_code", source: "IP Region Code", type: "string"}

- file:
    id: "apple_messaging_json"
  static:
    event.kind: "state"
    event.category: ["authentication", "session"]
    event.type: ["info"]
    entity.type: "application"
    entity.sub_type: "app_registration"
  fields:
  - {target: "device.model.identifier", source: "hardware-version", type: "string"}
  - {target: "entity.display_name", source: "device-name", type: "string"}
  - {target: "user_agent.original", source: "os-version", type: "string"}
  - {target: "auth.method", source: "device-trust-level", type: "string"}

- file:
    id: "apple_find_my_devices"
    where:
      source: "__segment_header"
      op: "contains"
      value: "Devices Information"
  static:
    event.kind: "state"
    event.category: ["authentication", "session"]
    event.type: ["info"]
    entity.type: "host"
    entity.sub_type: "hardware_registration"
  fields:
  - { target: "@timestamp", source: "Last Active Timestamp", type: "datetime" }
  - { target: "entity.first_seen_timestamp", source: "First Register Timestamp", type: "datetime" }
  - { target: "entity.last_seen_timestamp", source: "Location Timestamp", type: "datetime" }
  - { target: "entity.display_name", source: "Device Name", type: "string" }
  - { target: "device.model.identifier", source: ["Device Model", "Paired Devices[0].productType"], transform: coalesce, type: "string" }
  - { target: "os.version", source: "Product Version", type: "string" }
  - { target: "user_agent.os.type", source: "Device Platform", type: "string" }
  - { target: "user_agent.original", source: "Device OS Build Version", type: "string" }
  - { target: "device.timezone", source: "Device Timezone", type: "string" }
  - { target: "device.locale", source: "Device Locale", type: "string" }
  - { target: "geo.name", source: "Location", type: "string" }
  - { target: "device.serial_number", source: "Device Serial Number", type: "string" }
  - { target: "device.serial_number", source: "Accessories Serial Number", regex: '"systemSerialNumber"\s*:\s*"([^"]+)"', type: "string" }
  - { target: "device.serial_number", source: "Accessories Serial Number", type: "string" }
  - { target: "entity.id", source: "UDID", type: "string" }
  - { target: "entity.id", source: "Paired Devices", regex: '"udid"\s*:\s*"([^"]+)"', type: "string" }

- file:
    id: "apple_find_my_devices"
    where:
      source: "__segment_header"
      op: "contains"
      value: "Me Device Registration Information"
  static:
    event.kind: "state"
    event.category: ["authentication", "session"]
    event.type: ["info"]
    entity.type: "host"
    entity.sub_type: "hardware_registration"
  fields:
  - { target: "@timestamp", source: "Last Active Timestamp", type: "datetime" }
  - { target: "entity.first_seen_timestamp", source: "First Register Timestamp", type: "datetime" }
  - { target: "entity.last_seen_timestamp", source: "Location Timestamp", type: "datetime" }
  - { target: "entity.display_name", source: "Device Name", type: "string" }
  - { target: "device.model.identifier", source: "Device Model", type: "string" }
  - { target: "os.version", source: "Product Version", type: "string" }
  - { target: "device.timezone", source: "Device Timezone", type: "string" }
  - { target: "device.locale", source: "Device Locale", type: "string" }
  - { target: "geo.name", source: "Location", type: "string" }
  - { target: "device.serial_number", source: "Device Serial Number", type: "string" }
  - { target: "entity.id", source: "UDID", type: "string" }
  - { target: "device.id.apple", source: "UDID", type: "string" } # join key shared w/ apple_find_my_deleted_devices below

- file:
    id: "apple_find_my_devices"
    where:
      source: "__segment_header"
      op: "contains"
      value: "Deleted Devices Information"
  static:
    event.kind: "state"
    event.category: ["authentication", "session"]
    event.type: ["info"]
    entity.type: "host"
    entity.sub_type: "hardware_registration"
    entity.inactive: true
  fields:
  - { target: "@timestamp", source: "Delete Timestamp", type: "datetime" }
  - { target: "entity.first_seen_timestamp", source: "Find My iPhone Registration Timestamp", type: "datetime" }
  - { target: "entity.last_seen_timestamp", source: "Find My iPhone Enabled Timestamp", type: "datetime" }
  - { target: "entity.display_name", source: "Device Name", type: "string" }
  - { target: "device.model.identifier", source: "Product Type", type: "string" }
  - { target: "os.version", source: "Product Version", type: "string" }
  - { target: "entity.id", source: "UDID", type: "string" }
  - { target: "device.id.apple", source: "UDID", type: "string" } # join key shared w/ apple_find_my_devices above
  # Find My iPhone Disable Reason / Passcode Set dropped — no taxonomy field fits yet, revisit
