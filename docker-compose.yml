services:
  # The anonymous /workspace/... volumes keep the image's own node_modules and .venv,
  # so the host bind mount doesn't shadow them with host-built (e.g. macOS) binaries.
  web:
    build: .
    ports:
      - "5001:5001"
    environment:
      - PERFORMANCE_MEMORY_SAMPLING=${PERFORMANCE_MEMORY_SAMPLING:-0}
    volumes:
      - .:/workspace
      - /workspace/.venv
      - /workspace/node_modules
      - /workspace/webapp/node_modules
    command: yarn --cwd webapp serve


  eval:
    build: .
    volumes:
      - .:/workspace
      - data_raw:/workspace/evaluation/entity_resolution/data_raw
      - /workspace/.venv
      - /workspace/node_modules
      - /workspace/webapp/node_modules
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: /bin/bash

  test:
    build: .
    volumes:
      - .:/workspace
      - /workspace/.venv
      - /workspace/node_modules
      - /workspace/webapp/node_modules
    command: uv run pytest tests/python

volumes:
  data_raw:

