# Points at unpacked data exports on your own machine. Nothing here ships with the repo:
# any file that isn't present is skipped with a warning (see tests/README.md).
platforms:
  facebook:
    test_data_dir: "~/takeout-test-data/facebook"

  apple:
    test_data_dir: "~/takeout-test-data/apple"

  instagram:
    test_data_dir: "~/takeout-test-data/instagram"

  discord:
    test_data_dir: "~/takeout-test-data/discord"


test_files:
  json:
    - path: "facebook/security_and_login_information/account_activity.json"
      platform: "facebook"
      expected:
        num_records: 59
        raw_keys: ['action', 'timestamp', 'ip_address']

    - path: "facebook/security_and_login_information/record_details.json"
      platform: "facebook"


    - path: "facebook/security_and_login_information/logins_and_logouts.json"
      platform: "facebook"
      expected:
        num_records: 26
  
    - path: "apple/Devices Registered with Apple Messaging.json"
      platform: "apple"
      expected:
        num_records: 1
  
  json_label_values:
    - path: "facebook/personal_information/profile_information/your_devices.json"
      platform: "facebook"
      expected:
        num_records: 2

  jsonl:
    - path: "discord/activity/analytics/events-2025-00000-of-00001.json"
      platform: "discord"
      expected:
        num_records: 2324
        raw_keys: ['event_type']

  csv:
    - path: "apple/Apple ID account and device information/Apple ID SignOn Information.csv"
      platform: "apple"
      expected:
        num_records: 79
        raw_keys: ['Application', 'IP Address', 'Logged In Date']


