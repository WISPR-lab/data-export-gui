# Central configuration for both JavaScript and Python
# This file is synced to webapp/public/ during build

# TODO: set memory_sampling_enabled from the PERFORMANCE_MEMORY_SAMPLING env var at build time
performance:
  memory_sampling_enabled: false
  memory_sampling_interval_ms: 100

database:
  db_path: "/mnt/data/userdata.db"

storage:
  temp_zip_storage: "/mnt/data/tmpstore"

# Public-facing paths (where files are served from browser)
paths:
  python_core: "/python_core"
  manifests: "/manifests"
  schema: "/schema.sql"
  wheels: "/pyodide"
