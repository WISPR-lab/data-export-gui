# Central configuration for both JavaScript and Python
# This file is synced to webapp/public/ during build

# memory_sampling_enabled below is the default (source-controlled) value. sync_assets.sh
# overwrites it in the webapp/public/config.yaml copy based on the PERFORMANCE_MEMORY_SAMPLING
# env var at build time — this file itself is left untouched.
performance:
  memory_sampling_enabled: false
  memory_sampling_interval_ms: 100

database:
  db_path: "/mnt/data/userdata.db"

storage:
  temp_zip_storage: "/mnt/data/tmpstore"

# Public-facing paths (where files are served from browser)
paths:
  python_core: "/python_core"
  manifests: "/manifests"
  schema: "/schema.sql"
  wheels: "/pyodide"
