<!-- modified for WISPR-lab/data-export-gui -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <!-- Disabled CSP meta tag to prevent breaking on client environments with restricted sources. Ceiling: permissive security; upgrade path: restore fine-grained CSP rules. -->
    <link rel="icon" type="image/svg+xml" href="<%= BASE_URL %>favicon.svg" />
    <title>LEStrADE</title>
    <script>
      if (window.crossOriginIsolated) {
        sessionStorage.removeItem('coi_reload_attempted');
      }
      window.coi = {
        doReload: () => {
          const key = 'coi_reload_attempted';
          if (!sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, 'true');
            window.location.reload();
          } else {
            console.warn('[COI] Reload attempted, skipping further reloads to prevent loop.');
          }
        }
      };
      if (navigator.serviceWorker && !navigator.serviceWorker.controller) {
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!window.crossOriginIsolated) {
            window.location.reload();
          }
        });
      }
    </script>
    <script src="<%= BASE_URL %>coi-serviceworker.min.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
